{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %} {% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/tema.css' %}">
    <link rel="stylesheet" href="{% static 'css/alertas.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    
    {% include "navbar.html" %}
    <main>
        <div class="container-fluid">
            {% block contenido %}
            {% endblock %}
        </div>
    </main>

    {% if messages %}
    <script>
        async function mostrarMensajes() {
            {% for mensaje in messages %}
            await Swal.fire({
                icon: "{% if mensaje.level_tag == 'error' %}error{% else %}success{% endif %}",
                title: "Aviso",
                text: "{{ mensaje|escapejs }}",
                confirmButtonText: "Aceptar",
                buttonsStyling: false,
                customClass: {
                    container: "rueda-alert-container",
                    popup: "rueda-alert-popup",
                    icon: "rueda-alert-icon",
                    title: "rueda-alert-title",
                    htmlContainer: "rueda-alert-message",
                    confirmButton: "rueda-alert-confirm"
                }
            });
            {% endfor %}
        }

        mostrarMensajes()
    </script>
    {% endif %}

</body>

</html>
